services:
  stt:
    build:
      context: .
      dockerfile: Dockerfile.stt
    ports:
      - "${STT_PORT}:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/docs >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT}:7860"
    environment:
      LM_STUDIO_BASE_URL: "${LM_STUDIO_BASE_URL}"
      MODEL_NAME: "${MODEL_NAME}"
      STT_URL: "${STT_URL}"
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
      PYTHONUNBUFFERED: "1"
    depends_on:
      stt:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7860/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
