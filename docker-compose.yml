services:
  stt:
    build:
      context: .
      dockerfile: Dockerfile.stt
    ports:
      - "${STT_PORT:-8000}:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/docs >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "${WEB_PORT:-7860}:7860"
    environment:
      LM_STUDIO_BASE_URL: "http://host.docker.internal:1234/v1"
      LM_STUDIO_API_KEY: "${LM_STUDIO_API_KEY:-lm-studio}"
      MODEL_NAME: "${MODEL_NAME:-qwen/qwen3-8b}"
      STT_URL: "http://stt:8000/transcribe"
      EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}"
      DRIFT_SCORE_THRESHOLD: "${DRIFT_SCORE_THRESHOLD:-0.45}"
      ON_TOPIC_OVERRIDE_SCORE: "${ON_TOPIC_OVERRIDE_SCORE:-0.80}"
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
      PYTHONUNBUFFERED: "1"
    depends_on:
      stt:
        condition: service_healthy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7860/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s
