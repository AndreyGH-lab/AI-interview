[project]
name = "orchestrator"
version = "0.1.0"
description = "ИИ-интервьюер по ML и MLOps: LangGraph-агент, FAISS-ретривал, Gradio UI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "gradio>=6.0.1",
    "langchain-community>=0.4.1",
    "langchain-core>=1.1.0",
    "langchain-openai>=1.1.0",
    "langgraph>=1.0.4",
    "requests>=2.32.5",
    "python-dotenv>=1.0.0",
    "tavily-python>=0.7.13",
    "sentence-transformers",
    "torch",
    "faiss-cpu",
    "transformers>=4.41,<4.45",
    "huggingface-hub>=0.23,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # нужен только бенчмарку ретривала: лексический бейзлайн на TF-IDF
    "scikit-learn>=1.3",
]

[tool.pytest.ini_options]
# корень проекта в sys.path, чтобы работал импорт services.*
pythonpath = ["."]
testpaths = ["tests"]

# torch берём из CPU-индекса: на Linux обычная сборка тянет ~3 ГБ
# библиотек CUDA, которые сервису не нужны — эмбеддинги считаются на CPU.
# torch указан в dependencies явно, потому что tool.uv.sources
# действует только на прямые зависимости, а не на транзитивные.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
